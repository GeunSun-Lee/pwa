<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <!-- 1. 뷰포트: 세로/가로 모드 완벽 지원, 줌 금지(앱 느낌), 세이프 에어리어 활용 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,-scalable=no, viewport-fit=cover">
  
  <!-- 2. [Critical Fix #21] GitHub Pages 서브디렉토리 배포 대응을 위한 Base HREF 필수 -->
  <!-- ⚠️ 아래 '/first-math/' 부분을 본인 레포지토리 이름으로 변경하세요. (예: '/kids-math/') -->
  <!-- 로컬 테스트 시 '/' 로 두고, 배포 시 레포지토리명으로 변경 권장 -->
  <base href="/math_starter/">
  
  <!-- 3. PWA 필수 메타 태그 (안드로이드/크롬 최적화) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E3A5F" media="(prefers-color-scheme: dark)">
  
  <!-- 4. 매니페스트 연결 (홈 화면 추가용) -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- 5. 아이콘 (마스크어블 아이콘 권장) -->
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  
  <!-- 6. 스타일시트 분리 로드 -->
  <link rel="stylesheet" href="css/style.css">
  
  <title>산수 연습장</title>
  
  <!-- 7. 인라인 Critical CSS (최초 렌더링 깜빡임 방지용, style.css 로드 전 배경색 등) -->
  <style>
    :root { --bg-color: #F8FAFC; --text-color: #1E293B; --primary: #2563EB; }
    @media (prefers-color-scheme: dark) { :root { --bg-color: #0F172A; --text-color: #F1F5F9; --primary: #3B82F6; } }
    html, body { height: 100%; margin: 0; background: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    #app { display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh; min-height: 100vh; /* Fallback */ }
    /* 로딩 스피너 (JS 로드 전 대기 화면) */
    .loading-indicator { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 1rem; color: var(--text-color); }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--color-border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 8. 로딩 인디케이터 (앱 초기화 완료 시 JS에서 제거) -->
  <div id="loading-screen" class="loading-indicator" aria-hidden="true">
    <div class="spinner"></div>
    <span>산수 연습장 불러오는 중...</span>
  </div>

  <!-- 9. 루트 컨테이너: Grid 레이아웃으로 Header/Main/Footer 고정 -->
  <div id="app" role="application" aria-label="산수 연습장 학습 앱" style="display: none;"> <!-- 초기 숨김 -->
    
    <!-- 상단 헤더: 설정, 통계 진입점 -->
    <header class="app-header" role="banner">
      <div class="header-left">
        <button type="button" id="btn-settings" class="icon-btn" aria-label="설정 열기" aria-expanded="false" aria-controls="panel-settings">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div class="header-center">
        <h1 class="app-title">산수 연습장</h1>
      </div>
      <div class="header-right">
        <button type="button" id="btn-stats" class="icon-btn" aria-label="학습 통계 보기" aria-expanded="false" aria-controls="panel-stats">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </button>
      </div>
    </header>

    <!-- 메인 콘텐츠 영역: 뷰 전환(메뉴/게임/결과) 컨테이너 -->
    <main id="main-view" class="app-main" role="main" aria-live="polite">
      <!-- 
        이 영역은 JS(main.js)에서 동적으로 렌더링됩니다.
        - #view-menu: 모드 선택(연습/도전), 난이도 선택
        - #view-game: 문제 표시, 키패드, 진행바
        - #view-result: 정답률, 오답 노트, 다시하기
      -->
      <div id="view-menu" class="view" role="region" aria-label="메인 메뉴" hidden></div>
      <div id="view-game" class="view" role="region" aria-label="문제 풀이" hidden></div>
      <div id="view-result" class="view" role="region" aria-label="결과 확인" hidden></div>
    </main>

    <!-- 하단 푸터: 버전 정보 등 -->
    <footer class="app-footer" role="contentinfo">
      <small>v1.0.0 &copy; 2026 산수 연습장</small>
    </footer>

  </div>

  <!-- 10. 모달/토스트/패널 등 오버레이 컨테이너 (Body 최하단) -->
  <div id="overlay-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- 11. 자바스크립트 모듈 로드 (ES Module) -->
  <script type="module">
    // 1. 로딩 화면 제어
    const loadingScreen = document.getElementById('loading-screen');
    const appRoot = document.getElementById('app');
    
    function hideLoading() {
      if (loadingScreen) loadingScreen.remove();
      if (appRoot) appRoot.style.display = 'grid';
    }

    // 2. Service Worker 등록 (오프라인 지원 핵심)
    if ('serviceWorker' in navigator) {
      // base href가 설정되어 있으므로 relative path './sw.js'가 올바르게 해석됨
      const swUrl = new URL('./sw.js', document.baseURI).href;
      
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(swUrl, { scope: document.baseURI })
          .then(reg => {
            console.log('[SW] 등록 성공:', reg.scope);
            // 업데이트 체크 (수동 트리거용)
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker?.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // 새 버전 설치 완료 알림 (main.js에서 토스트 처리)
                  window.dispatchEvent(new CustomEvent('sw:update', { detail: reg }));
                }
              });
            });
          })
          .catch(err => console.error('[SW] 등록 실패:', err));
      });
    }

    // 3. 메인 앱 진입점 임포트
    try {
      await import('./js/main.js');
      // main.js bootstrap 완료 후 로딩 화면 제거
      // main.js 내부에서 DOMContentLoaded 처리하므로 여기서는 바로 숨김 처리 가능
      // 단, main.js 실행 중 에러 나면 로딩 화면 남음 -> 에러 확인 용이
      hideLoading();
    } catch (err) {
      console.error('[App] 메인 모듈 로드 실패:', err);
      hideLoading();
      document.body.innerHTML = `<div style="padding:2rem; text-align:center; color:var(--color-error); font-family: sans-serif;">
        <h2>앱 로드 실패</h2>
        <p><strong>${err.message}</strong></p>
        <p>개발자 도구 콘솔을 확인하세요.</p>
        <button onclick="location.reload()" style="margin-top:1rem; padding:0.5rem 1rem; background:var(--primary); color:white; border:none; border-radius:8px;">다시 시도</button>
      </div>`;
    }
  </script>
</body>
</html>
