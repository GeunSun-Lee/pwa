<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알록달록 나의 첫 독서록 📚</title>
    <style>
        :root {
            --bg-color: #FFF9E6;
            --card-bg: #FFFFFF;
            --primary: #FF8A65;
            --primary-hover: #FF7043;
            --accent: #4FC3F7;
            --text-main: #424242;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif, apple color emoji, segoe ui emoji;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            font-size: 18px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            background: #FFE082;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        header h1 {
            font-size: 1.8rem;
            color: #E65100;
            margin-bottom: 8px;
        }

        /* 칭찬 스티커판 */
        .stats-badge {
            display: inline-block;
            background: #FFF;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #2E7D32;
            border: 3px solid #81C784;
            margin-top: 5px;
        }

        /* 메인 컨테이너 */
        .container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            border: 2px solid #FFE0B2;
        }

        .card h2 {
            font-size: 1.4rem;
            color: #F57C00;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 폼 요소 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            border: 2px solid #FFCC80;
            border-radius: 12px;
            outline: none;
            background-color: #FFFDE7;
        }

        input[type="text"]:focus, input[type="date"]:focus {
            border-color: var(--primary);
        }

        /* 별점 평가 */
        .star-rating {
            display: flex;
            gap: 10px;
            font-size: 2.5rem;
            cursor: pointer;
            user-select: none;
        }

        .star {
            color: #E0E0E0;
            transition: transform 0.1s;
        }

        .star.active {
            color: #FFB300;
        }

        .star:hover {
            transform: scale(1.2);
        }

        /* 이모지 느낌 선택 */
        .emoji-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .emoji-btn {
            background: #F5F5F5;
            border: 2px solid #E0E0E0;
            border-radius: 15px;
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .emoji-btn.selected {
            background: #E1F5FE;
            border-color: var(--accent);
            transform: scale(1.05);
            font-weight: bold;
        }

        /* 캔버스 그림판 */
        .canvas-container {
            border: 2px dashed #FFB74D;
            border-radius: 12px;
            background: #FFF;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        canvas {
            background: #FFFFFF;
            border-radius: 8px;
            cursor: crosshair;
            width: 100%;
            max-width: 500px;
            height: 250px;
            border: 1px solid #EEE;
        }

        .canvas-tools {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #CCC;
            cursor: pointer;
        }

        .color-btn.active {
            border: 3px solid #000;
            transform: scale(1.1);
        }

        /* 버튼 */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0 #E64A19;
            transition: all 0.1s;
            width: 100%;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-secondary {
            background: #78909C;
            box-shadow: 0 4px 0 #455A64;
            padding: 8px 15px;
            font-size: 0.9rem;
            width: auto;
        }

        /* 내 서재 목록 카드 */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .book-card {
            background: #FFF9C4;
            border: 2px solid #FFF59D;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-5px);
        }

        .book-card .title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-card .date {
            font-size: 0.85rem;
            color: #757575;
        }

        .book-card .stars {
            color: #FFB300;
            font-size: 1rem;
        }

        .book-card .emoji {
            font-size: 1.5rem;
            text-align: right;
        }

        /* 상세 보기 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
        }

        .modal-img {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #DDD;
            margin-top: 10px;
        }

        /* 백업/복구 영역 */
        .backup-area {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>📖 알록달록 나의 첫 독서록</h1>
        <div class="stats-badge" id="statsBadge">독서 나무를 심는 중... 🌱</div>
    </header>

    <div class="container">
        <!-- 독서록 작성 폼 -->
        <div class="card">
            <h2>✏️ 오늘 읽은 책을 기록해요</h2>
            
            <div class="form-group">
                <label for="bookTitle">책 제목</label>
                <input type="text" id="bookTitle" placeholder="예) 강아지 똥" required>
            </div>

            <div class="form-group">
                <label for="readDate">읽은 날짜</label>
                <input type="date" id="readDate">
            </div>

            <div class="form-group">
                <label>얼마나 재미있었나요?</label>
                <div class="star-rating" id="starRating">
                    <span class="star active" data-value="1">★</span>
                    <span class="star active" data-value="2">★</span>
                    <span class="star active" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
            </div>

            <div class="form-group">
                <label>어떤 느낌이 들었나요?</label>
                <div class="emoji-picker" id="emojiPicker">
                    <button type="button" class="emoji-btn selected" data-emoji="😆">😆 재밌어요</button>
                    <button type="button" class="emoji-btn" data-emoji="😲">😲 신기해요</button>
                    <button type="button" class="emoji-btn" data-emoji="🥰">🥰 감동이에요</button>
                    <button type="button" class="emoji-btn" data-emoji="😢">😢 슬퍼요</button>
                    <button type="button" class="emoji-btn" data-emoji="😱">😱 무서워요</button>
                </div>
            </div>

            <div class="form-group">
                <label for="shortComment">한 줄 느낌</label>
                <input type="text" id="shortComment" placeholder="예) 강아지 똥이 멋진 꽃이 되어서 기뻤다.">
            </div>

            <div class="form-group">
                <label>기억에 남는 장면 그리기 🎨</label>
                <div class="canvas-container">
                    <canvas id="drawCanvas" width="500" height="250"></canvas>
                    <div class="canvas-tools">
                        <div class="color-btn active" style="background:#000" data-color="#000"></div>
                        <div class="color-btn" style="background:#FF1744" data-color="#FF1744"></div>
                        <div class="color-btn" style="background:#29B6F6" data-color="#29B6F6"></div>
                        <div class="color-btn" style="background:#9CCC65" data-color="#9CCC65"></div>
                        <div class="color-btn" style="background:#FFCA28" data-color="#FFCA28"></div>
                        <button type="button" class="btn btn-secondary" id="clearCanvas">싹 지우기</button>
                    </div>
                </div>
            </div>

            <button class="btn" id="saveBtn">독서 스탬프 받기! 🌟</button>
        </div>

        <!-- 내 서재 목록 -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2>📚 내가 읽은 책들</h2>
                <div class="backup-area">
                    <button class="btn btn-secondary" id="exportBtn">백업하기</button>
                    <button class="btn btn-secondary" id="importBtn">복구하기</button>
                    <input type="file" id="importFile" accept=".json" style="display: none;">
                </div>
            </div>
            <div class="book-grid" id="bookGrid">
                <!-- 독서록 카드가 여기에 추가됨 -->
            </div>
        </div>
    </div>

    <!-- 상세 보기 모달 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">✖</button>
            <h2 id="modalTitle" style="color: #E65100; margin-bottom: 5px;"></h2>
            <div id="modalDate" style="font-size: 0.9rem; color: #666; margin-bottom: 10px;"></div>
            <div id="modalStars" style="color: #FFB300; font-size: 1.3rem; margin-bottom: 10px;"></div>
            <div id="modalEmoji" style="font-size: 1.1rem; margin-bottom: 15px;"></div>
            <div id="modalComment" style="background: #FFFDE7; padding: 12px; border-radius: 10px; margin-bottom: 15px;"></div>
            <div id="modalImageArea"></div>
            <button class="btn" id="deleteBtn" style="background: #EF5350; box-shadow: 0 4px 0 #C62828; margin-top: 15px;">삭제하기</button>
        </div>
    </div>

    <script>
        // IndexedDB 설정
        let db;
        const DB_NAME = 'ChildBookLogDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'books';

        // 앱 초기화
        window.addEventListener('DOMContentLoaded', () => {
            initDB();
            initForm();
            initCanvas();
        });

        function initDB() {
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                }
            };

            request.onsuccess = (e) => {
                db = e.target.result;
                loadBooks();
            };

            request.onerror = (e) => {
                alert('DB를 열지 못했어요: ' + e.target.error);
            };
        }

        // 폼 초기 설정
        let currentRating = 3;
        let selectedEmoji = '😆 재밌어요';

        function initForm() {
            document.getElementById('readDate').valueAsDate = new Date();

            // 별점 컨트롤
            const stars = document.querySelectorAll('.star');
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    currentRating = parseInt(star.dataset.value);
                    stars.forEach((s, idx) => {
                        if (idx < currentRating) s.classList.add('active');
                        else s.classList.remove('active');
                    });
                });
            });

            // 이모지 선택
            const emojiBtns = document.querySelectorAll('.emoji-btn');
            emojiBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    emojiBtns.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedEmoji = btn.innerText;
                });
            });

            // 저장 버튼
            document.getElementById('saveBtn').addEventListener('click', saveBook);

            // 모달 닫기
            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('detailModal').style.display = 'none';
            });

            // 백업 및 복구
            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
            document.getElementById('importFile').addEventListener('change', importData);
        }

        // 캔버스 그림판 로직
        let canvas, ctx, isDrawing = false, currentColor = '#000000';

        function initCanvas() {
            canvas = document.getElementById('drawCanvas');
            ctx = canvas.getContext('2d');
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            // 색상 선택
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentColor = btn.dataset.color;
                });
            });

            // 지우기
            document.getElementById('clearCanvas').addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });

            // 마우스 & 터치 이벤트
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (canvas.width / rect.width),
                    y: (clientY - rect.top) * (canvas.height / rect.height)
                };
            };

            const startDraw = (e) => {
                isDrawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.strokeStyle = currentColor;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDraw = () => { isDrawing = false; };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);

            canvas.addEventListener('touchstart', startDraw);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', stopDraw);
        }

        // 데이터 저장
        function saveBook() {
            const title = document.getElementById('bookTitle').value.trim();
            const date = document.getElementById('readDate').value;
            const comment = document.getElementById('shortComment').value.trim();
            
            if (!title) {
                alert('책 제목을 입력해주세요! 📖');
                return;
            }

            // Canvas 그림을 DataURL로 변환 (빈 도화지 검사 생략)
            const drawingData = canvas.toDataURL();

            const book = {
                title,
                date,
                rating: currentRating,
                emoji: selectedEmoji,
                comment,
                drawing: drawingData,
                createdAt: new Date().getTime()
            };

            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.add(book);

            tx.oncomplete = () => {
                alert('참 잘했어요! 독서 스탬프를 받았어요 🎉');
                resetForm();
                loadBooks();
            };
        }

        function resetForm() {
            document.getElementById('bookTitle').value = '';
            document.getElementById('shortComment').value = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // 목록 불러오기 및 통계 업데이트
        function loadBooks() {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const request = store.getAll();

            request.onsuccess = () => {
                const books = request.result;
                renderBookGrid(books);
                updateStats(books.length);
            };
        }

        function updateStats(count) {
            let badgeText = `지금까지 ${count}권 읽었어요! `;
            if (count === 0) badgeText += '독서 씨앗 🌱';
            else if (count < 5) badgeText += '독서 새싹 🌿';
            else if (count < 10) badgeText += '독서 꽃 🌸';
            else badgeText += '독서 왕 👑';
            
            document.getElementById('statsBadge').innerText = badgeText;
        }

        function renderBookGrid(books) {
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';

            if (books.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888; padding: 20px;">아직 읽은 책이 없어요. 첫 책을 기록해 보세요!</p>';
                return;
            }

            // 최신순 정렬
            books.sort((a, b) => b.createdAt - a.createdAt);

            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="title">${escapeHtml(book.title)}</div>
                    <div class="date">${book.date}</div>
                    <div class="stars">${'★'.repeat(book.rating)}${'☆'.repeat(5 - book.rating)}</div>
                    <div class="emoji">${book.emoji.split(' ')[0]}</div>
                `;
                card.addEventListener('click', () => showDetail(book));
                grid.appendChild(card);
            });
        }

        // 상세 보기
        let currentDetailId = null;
        function showDetail(book) {
            currentDetailId = book.id;
            document.getElementById('modalTitle').innerText = book.title;
            document.getElementById('modalDate').innerText = `읽은 날짜: ${book.date}`;
            document.getElementById('modalStars').innerText = '★'.repeat(book.rating) + '☆'.repeat(5 - book.rating);
            document.getElementById('modalEmoji').innerText = `내 느낌: ${book.emoji}`;
            document.getElementById('modalComment').innerText = book.comment ? `"${book.comment}"` : '(작성한 느낌 글이 없어요)';

            const imgArea = document.getElementById('modalImageArea');
            imgArea.innerHTML = '';
            
            // 캔버스에 그려진 그림이 있는 경우 (초기화 상태 배경 제외)
            if (book.drawing && book.drawing.length > 1000) { 
                const img = document.createElement('img');
                img.src = book.drawing;
                img.className = 'modal-img';
                imgArea.appendChild(img);
            }

            document.getElementById('detailModal').style.display = 'flex';
        }

        // 삭제하기
        document.getElementById('deleteBtn').addEventListener('click', () => {
            if (!currentDetailId) return;
            if (confirm('이 독서록을 davvero 삭제할까요?')) {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(currentDetailId);
                tx.oncomplete = () => {
                    document.getElementById('detailModal').style.display = 'none';
                    loadBooks();
                };
            }
        });

        // 데이터 백업 (JSON 다운로드)
        function exportData() {
            const tx = db.transaction(STORE_NAME, 'readonly');
            tx.objectStore(STORE_NAME).getAll().onsuccess = (e) => {
                const data = JSON.stringify(e.target.result);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `my_book_log_backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };
        }

        // 데이터 복구 (JSON 업로드)
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const books = JSON.parse(event.target.result);
                    if (!Array.isArray(books)) throw new Error('올바르지 않은 백업 파일 형식입니다.');

                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);

                    books.forEach(book => {
                        delete book.id; // 기존 ID 충돌 방지
                        store.add(book);
                    });

                    tx.oncomplete = () => {
                        alert('성공적으로 데이터를 가져왔습니다! 🎈');
                        loadBooks();
                    };
                } catch (err) {
                    alert('파일을 불러오는데 실패했습니다: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        // XSS 방지 파싱
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
