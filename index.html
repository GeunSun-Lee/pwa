<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My GitHub Pages</title>
  <meta name="description" content="GitHub Pages로 만든 웹사이트입니다." />
  <meta name="author" content="Your Name" />

  <!-- Open Graph -->
  <meta property="og:title" content="My GitHub Pages" />
  <meta property="og:description" content="GitHub Pages로 만든 웹사이트입니다." />
  <meta property="og:type" content="website" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #666;
    }

    section {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      margin-bottom: 2rem;
    }

    footer {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-top: 2rem;
    }

    a {
      color: #0366d6;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      margin-top: 1rem;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #0366d6;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #024ea2;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>🚀 GitHub Pages</h1>
      <p>GitHub Pages 기본 템플릿</p>
    </header>

    <main>
      <section>
        <h2>환영합니다!</h2>
        <p>
          이 페이지는 GitHub Pages에서 제공하는 정적 웹사이트입니다.
        </p>

        <button id="helloBtn">클릭해 보세요</button>
      </section>

      <section>
        <h2>다음 단계</h2>
        <ul>
          <li>내용 수정하기</li>
          <li>CSS 추가하기</li>
          <li>JavaScript 기능 구현하기</li>
          <li>GitHub에 Push하기</li>
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Your Name. Powered by GitHub Pages.</p>
    </footer>
  </div>

  <script>
    document.getElementById("helloBtn").addEventListener("click", () => {
      alert("GitHub Pages가 정상적으로 동작합니다! 🎉");
    });
  </script>
</body>
</html>
