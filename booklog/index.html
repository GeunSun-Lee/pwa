<!DOCTYPE html>
<html lang="ko" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="IndexedDB 기반 오프라인 독서록">
  <meta name="theme-color" content="#2d6a4f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b4332" media="(prefers-color-scheme: dark)">
  
  <!-- PWA Manifest (선택: 나중 단계에서 manifest.json 별도 파일로 분리) -->
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

  <!-- 1. CSS 로드 -->
  <link rel="stylesheet" href="style.css">

  <!-- 2. 외부 라이브러리 CDN (ESM 호환 버전) -->
  <!-- marked: 마크다운 파싱, uuid: ID 생성 -->
  <!-- importmap을 써서 베어 임포터(bare specifier) 문제를 회피합니다. -->
  <script type="importmap">
  {
    "imports": {
      "marked": "https://cdn.jsdelivr.net/npm/marked@12/+esm",
      "uuid": "https://cdn.jsdelivr.net/npm/uuid@9/+esm",
      "idb": "https://cdn.jsdelivr.net/npm/idb@8/+esm"
    }
  }
  </script>

  <title>내 독서록 📚</title>
</head>
<body>
  <!-- 
    루트 컨테이너: SPA 마운트 포인트 
    data-route 속성으로 현재 뷰 식별 (CSS 선택자 용)
  -->
  <div id="app" data-route="list" role="main"></div>

  <!-- 
    전역 토스트/알림 컨테이너 (포털 패턴) 
    JS에서 동적으로 생성해도 무방하지만, HTML에 자리 잡아두면 FOUC 방지 
  -->
  <div id="toast-container" aria-live="polite" aria-atomic="true" class="toast-container"></div>

  <!-- 
    모달/다이얼로그 백드롭 컨테이너 (접근성: 인ERT 속성 토글) 
  -->
  <div id="modal-root" class="modal-root" inert></div>

  <!-- 3. 메인 애플리케이션 진입점 (ES Module) -->
  <script type="module" src="app.js"></script>

  <!-- 
    Service Worker 등록 (PWA / 오프라인 캐시) 
    배포 후 sw.js 파일이 루트에 있어야 동작합니다.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      // GitHub Pages 서브디렉토리 배포 시 scope 주의: scope: './' 또는 '/repo-name/'
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }
  </script>
</body>
</html>
