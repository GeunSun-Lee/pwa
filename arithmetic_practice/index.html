<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신나는 1학년 산수 교실</title>
    <style>
        :root {
            --bg-color: #f0f9ff;
            --card-bg: #ffffff;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --accent-color: #f59e0b;
            --correct-color: #10b981;
            --wrong-color: #ef4444;
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Screen Management */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* Typography & Components */
        h1 {
            color: var(--primary-color);
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 16px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #6b7280;
        }

        .btn-accent {
            background-color: var(--accent-color);
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        /* Quiz UI */
        .progress-bar {
            height: 12px;
            background-color: #e5e7eb;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-visual {
            min-height: 80px;
            background-color: #f3f4f6;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 24px;
        }

        .problem-box {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .answer-display {
            min-width: 80px;
            height: 60px;
            border-bottom: 4px solid var(--primary-color);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
        }

        /* Keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .key {
            background-color: #f3f4f6;
            color: #1f2937;
            font-size: 24px;
            font-weight: bold;
            padding: 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }

        .key:active {
            background-color: #d1d5db;
        }

        .key-submit {
            grid-column: span 2;
            background-color: var(--correct-color);
            color: white;
        }

        .key-delete {
            background-color: #f87171;
            color: white;
        }

        /* Feedback Animation Overlay */
        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .feedback-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .feedback-icon {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .feedback-text {
            font-size: 28px;
            font-weight: bold;
        }

        /* History List */
        .history-list {
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 20px;
        }

        .history-item {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 피드백 오버레이 -->
    <div id="feedback" class="feedback-overlay">
        <div id="feedback-icon" class="feedback-icon">🎉</div>
        <div id="feedback-text" class="feedback-text">참 잘했어요!</div>
    </div>

    <!-- 1. 시작 및 프로필 등록 화면 -->
    <div id="screen-start" class="screen active">
        <h1>🎈 신나는 산수 교실 🎈</h1>
        <p style="font-size: 18px; color: #6b7280;">이름을 입력하고 시작해요!</p>
        <input type="text" id="user-name-input" placeholder="이름을 적어주세요" maxlength="10">
        <button class="btn" onclick="registerUser()">시작하기</button>
    </div>

    <!-- 2. 난이도 및 메뉴 선택 화면 -->
    <div id="screen-menu" class="screen">
        <h2 id="welcome-msg">환영해요!</h2>
        <p style="font-size: 16px; color: #6b7280; margin-bottom: 20px;">연습할 단계를 선택하세요</p>
        
        <button class="btn" onclick="startQuiz(1)">1단계: 10 이하 모으기/가르기</button>
        <button class="btn" onclick="startQuiz(2)">2단계: 한 자리 수 덧셈/뺄셈</button>
        <button class="btn" onclick="startQuiz(3)">3단계: 10 만들기 (보수)</button>
        <button class="btn" onclick="startQuiz(4)">4단계: 20 이하 덧셈/뺄셈</button>
        
        <button class="btn btn-accent" onclick="showHistory()" style="margin-top: 10px;">🏆 나의 기록 보기</button>
    </div>

    <!-- 3. 문제 풀이 화면 -->
    <div id="screen-quiz" class="screen">
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        
        <!-- 시각적 힌트 도구 (바둑돌/과일) -->
        <div id="quiz-visual" class="quiz-visual"></div>

        <!-- 문제 표시 -->
        <div class="problem-box">
            <span id="problem-text">3 + 4 =</span>
            <span id="answer-display" class="answer-display">?</span>
        </div>

        <!-- 가상 키패드 -->
        <div class="keypad">
            <button class="key" onclick="appendNum('1')">1</button>
            <button class="key" onclick="appendNum('2')">2</button>
            <button class="key" onclick="appendNum('3')">3</button>
            <button class="key" onclick="appendNum('4')">4</button>
            <button class="key" onclick="appendNum('5')">5</button>
            <button class="key" onclick="appendNum('6')">6</button>
            <button class="key" onclick="appendNum('7')">7</button>
            <button class="key" onclick="appendNum('8')">8</button>
            <button class="key" onclick="appendNum('9')">9</button>
            <button class="key key-delete" onclick="deleteNum()">C</button>
            <button class="key" onclick="appendNum('0')">0</button>
            <button class="key key-submit" onclick="submitAnswer()">확인</button>
        </div>
    </div>

    <!-- 4. 결과 화면 -->
    <div id="screen-result" class="screen">
        <h1>🎉 학습 완료! 🎉</h1>
        <div id="result-sticker" style="font-size: 70px; margin: 10px 0;">⭐</div>
        <h2 id="result-score">10문제 중 10문제 정답!</h2>
        <p id="result-msg" style="font-size: 18px; color: #4b5563;">정말 대단해요! 완벽합니다!</p>
        
        <button class="btn" onclick="switchScreen('screen-menu')">다른 단계 풀기</button>
    </div>

    <!-- 5. 기록 보기 화면 -->
    <div id="screen-history" class="screen">
        <h2>🏆 나의 연습 기록</h2>
        <div id="history-list" class="history-list"></div>
        <button class="btn btn-secondary" onclick="switchScreen('screen-menu')">메인으로 돌아가기</button>
    </div>
</div>

<script>
    /* ==========================================
       1. IndexedDB 설정 및 초기화
       ========================================== */
    const DB_NAME = 'MathPracticeDB';
    const DB_VERSION = 1;
    let db = null;
    let currentUser = null;

    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('users')) {
                    db.createObjectStore('users', { keyPath: 'id', autoIncrement: true });
                }
                if (!db.objectStoreNames.contains('records')) {
                    const recordStore = db.createObjectStore('records', { keyPath: 'id', autoIncrement: true });
                    recordStore.createIndex('userId', 'userId', { unique: false });
                }
            };

            request.onsuccess = (e) => {
                db = e.target.result;
                resolve(db);
            };

            request.onerror = (e) => {
                console.error('IndexedDB 에러:', e.target.error);
                reject(e.target.error);
            };
        });
    }

    /* ==========================================
       2. 상태 관리 및 화면 전환
       ========================================== */
    let currentStage = 1;
    let currentQuestionIndex = 0;
    let score = 0;
    const TOTAL_QUESTIONS = 10;
    let questions = [];
    let currentAnswerInput = "";

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // 이름 입력 후 DB 등록/로드
    async function registerUser() {
        const nameInput = document.getElementById('user-name-input').value.trim();
        if (!nameInput) {
            alert('이름을 입력해주세요!');
            return;
        }

        const tx = db.transaction(['users'], 'readwrite');
        const store = tx.objectStore('users');
        
        // 기존 사용자 유무 간단 체크 (동일 이름 시 로드)
        const request = store.getAll();
        request.onsuccess = () => {
            const users = request.result;
            const existing = users.find(u => u.name === nameInput);
            
            if (existing) {
                currentUser = existing;
            } else {
                const newUser = { name: nameInput, createdAt: new Date() };
                const addReq = store.add(newUser);
                addReq.onsuccess = (e) => {
                    currentUser = { id: e.target.result, name: nameInput };
                };
            }
            document.getElementById('welcome-msg').innerText = `${nameInput} 어린이, 안녕! 👋`;
            switchScreen('screen-menu');
        };
    }

    /* ==========================================
       3. 문제 생성 로직 (초등 1학년 맞춤)
       ========================================== */
    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestions(stage) {
        const list = [];
        for (let i = 0; i < TOTAL_QUESTIONS; i++) {
            let num1, num2, op, answer, visualCount = 0;

            if (stage === 1) {
                // 1단계: 10 이하 모으기(덧셈)
                num1 = getRandomInt(1, 8);
                num2 = getRandomInt(1, 9 - num1);
                op = '+';
                answer = num1 + num2;
                visualCount = answer;
            } else if (stage === 2) {
                // 2단계: 한 자리 수 덧셈/뺄셈
                const isPlus = Math.random() > 0.5;
                if (isPlus) {
                    num1 = getRandomInt(1, 5);
                    num2 = getRandomInt(1, 4);
                    op = '+';
                    answer = num1 + num2;
                } else {
                    num1 = getRandomInt(2, 9);
                    num2 = getRandomInt(1, num1);
                    op = '-';
                    answer = num1 - num2;
                }
                visualCount = num1;
            } else if (stage === 3) {
                // 3단계: 10 만들기 (보수)
                num1 = getRandomInt(1, 9);
                num2 = 10 - num1;
                op = '+';
                answer = 10;
                visualCount = 10;
            } else if (stage === 4) {
                // 4단계: 받아올림 없는 20 이하 덧셈/뺄셈
                const isPlus = Math.random() > 0.5;
                if (isPlus) {
                    num1 = getRandomInt(10, 15);
                    num2 = getRandomInt(1, 4);
                    op = '+';
                    answer = num1 + num2;
                } else {
                    num1 = getRandomInt(11, 19);
                    num2 = getRandomInt(1, num1 - 10);
                    op = '-';
                    answer = num1 - num2;
                }
                visualCount = 0; // 수가 커지므로 도구 숨김
            }

            list.push({ num1, num2, op, answer, visualCount });
        }
        return list;
    }

    /* ==========================================
       4. 문제 풀이 진행
       ========================================== */
    function startQuiz(stage) {
        currentStage = stage;
        currentQuestionIndex = 0;
        score = 0;
        questions = generateQuestions(stage);
        switchScreen('screen-quiz');
        renderQuestion();
    }

    function renderQuestion() {
        currentAnswerInput = "";
        updateAnswerDisplay();

        const q = questions[currentQuestionIndex];
        
        // 게이지 바 업데이트
        const progressPercent = ((currentQuestionIndex) / TOTAL_QUESTIONS) * 100;
        document.getElementById('progress-fill').style.width = `${progressPercent}%`;

        // 텍스트 출력
        document.getElementById('problem-text').innerText = `${q.num1} ${q.op} ${q.num2} =`;

        // 시각적 보조 도구 (사과 이모지) Render
        const visualBox = document.getElementById('quiz-visual');
        visualBox.innerHTML = "";
        if (q.visualCount > 0 && q.visualCount <= 10) {
            for (let i = 0; i < q.visualCount; i++) {
                const item = document.createElement('span');
                item.innerText = '🍎';
                visualBox.appendChild(item);
            }
        } else {
            visualBox.innerText = '💡 차근차근 암산해보세요!';
        }
    }

    /* ==========================================
       5. 키패드 및 정답 확인
       ========================================== */
    function appendNum(num) {
        if (currentAnswerInput.length < 2) { // 2자리 이상 입력 방지
            currentAnswerInput += num;
            updateAnswerDisplay();
        }
    }

    function deleteNum() {
        currentAnswerInput = currentAnswerInput.slice(0, -1);
        updateAnswerDisplay();
    }

    function updateAnswerDisplay() {
        const display = document.getElementById('answer-display');
        display.innerText = currentAnswerInput === "" ? "?" : currentAnswerInput;
    }

    function submitAnswer() {
        if (currentAnswerInput === "") return;

        const q = questions[currentQuestionIndex];
        const isCorrect = parseInt(currentAnswerInput, 10) === q.answer;

        if (isCorrect) score++;

        showFeedback(isCorrect, () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < TOTAL_QUESTIONS) {
                renderQuestion();
            } else {
                finishQuiz();
            }
        });
    }

    function showFeedback(isCorrect, callback) {
        const overlay = document.getElementById('feedback');
        const icon = document.getElementById('feedback-icon');
        const text = document.getElementById('feedback-text');

        if (isCorrect) {
            icon.innerText = "🎉";
            text.innerText = "정답이에요!";
            text.style.color = "var(--correct-color)";
        } else {
            icon.innerText = "💭";
            text.innerText = `아쉬워요! (정답: ${questions[currentQuestionIndex].answer})`;
            text.style.color = "var(--wrong-color)";
        }

        overlay.classList.add('show');
        setTimeout(() => {
            overlay.classList.remove('show');
            callback();
        }, 1200);
    }

    /* ==========================================
       6. 결과 저장 (IndexedDB) 및 출력
       ========================================== */
    async function finishQuiz() {
        // 결과 DB 저장
        if (currentUser && currentUser.id) {
            const tx = db.transaction(['records'], 'readwrite');
            const store = tx.objectStore('records');
            const record = {
                userId: currentUser.id,
                stage: currentStage,
                score: score,
                total: TOTAL_QUESTIONS,
                date: new Date().toLocaleDateString('ko-KR') + " " + new Date().toLocaleTimeString('ko-KR', {hour: '2-digit', minute:'2-digit'})
            };
            store.add(record);
        }

        // 결과 화면 텍스트 설정
        document.getElementById('result-score').innerText = `${TOTAL_QUESTIONS}문제 중 ${score}문제 정답!`;
        
        const sticker = document.getElementById('result-sticker');
        const msg = document.getElementById('result-msg');
        
        if (score === 10) {
            sticker.innerText = "🏆";
            msg.innerText = "완벽해요! 산수 천재인가요?";
        } else if (score >= 7) {
            sticker.innerText = "⭐";
            msg.innerText = "잘했어요! 조금만 더 연습해볼까요?";
        } else {
            sticker.innerText = "🌱";
            msg.innerText = "차근차근 다시 도전해봐요!";
        }

        switchScreen('screen-result');
    }

    // 기록 화면 보기
    function showHistory() {
        if (!currentUser) return;

        const tx = db.transaction(['records'], 'readonly');
        const store = tx.objectStore('records');
        const index = store.index('userId');
        const request = index.getAll(currentUser.id);

        request.onsuccess = () => {
            const records = request.result.reverse(); // 최신순
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = "";

            if (records.length === 0) {
                listEl.innerHTML = "<p style='text-align:center; color:#9ca3af;'>아직 기록이 없어요.</p>";
            } else {
                records.forEach(r => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `
                        <div>
                            <strong>${r.stage}단계 연습</strong>
                            <div style="font-size:12px; color:#9ca3af;">${r.date}</div>
                        </div>
                        <div style="font-size:18px; font-weight:bold; color:var(--primary-color);">
                            ${r.score} / ${r.total}점
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            }
            switchScreen('screen-history');
        };
    }

    // 페이지 로드 시 DB 초기화
    window.addEventListener('DOMContentLoaded', () => {
        initDB().catch(err => {
            alert('DB 초기화 실패 (브라우저 설정을 확인해주세요)');
        });
    });
</script>
</body>
</html>
